apiVersion: v1
kind: Namespace
metadata:
  name: loja
---
apiVersion: v1
kind: Pod
metadata:
  name: loja-api
  namespace: loja
spec:
  hostNetwork: true
  containers:
    - name: api
      image: loja/api:latest
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Service
metadata:
  name: loja-api
  namespace: loja
spec:
  type: LoadBalancer
  selector:
    app: loja-api
  ports:
    - port: 80
